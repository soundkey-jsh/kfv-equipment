name: Supabase 깨우기
on:
  schedule:
    - cron: "17 2 */3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 장비 대장 데이터 한 번 읽기
        run: |
          URL=$(grep -oE 'url: *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          KEY=$(grep -oE 'key: *"[^"]+"' config.js | sed -E 's/.*"([^"]+)"/\1/')
          code=$(curl -s -o /dev/null -w "%{http_code}" "$URL/rest/v1/docs?select=id&limit=1" -H "apikey: $KEY")
          echo "응답 코드: $code"
          test "$code" = "200"
      - name: 읽은 시각 기록
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/last-ping.txt
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git add .github/last-ping.txt
          git commit -m "Supabase 깨우기 기록" || true
          git push
